name: Tự động biên dịch file APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Lấy mã nguồn (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Cài đặt Android SDK Command-line Tools
        uses: android-actions/setup-android@v3

      - name: 5. Cài đặt các gói phụ thuộc (Dependencies)
        run: |
          npm install

      - name: 6. Khởi tạo và đồng bộ dự án Android bằng Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Biên dịch file APK bằng Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Tải file APK lên GitHub Artifacts để người dùng tải về
        uses: actions/upload-artifact@v4
        with:
          name: MU-Idle-Awakening-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
